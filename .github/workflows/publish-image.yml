name: Publish x64 Docker image

# Run explicitly from the Actions page after uploading the source.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-x64-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish x64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=XianYuAssistant with SKU delivery and buyer interaction

      - name: Show image address
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.name }}:latest
        shell: bash
        run: |
          echo '## x64 image published' >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$PUBLISHED_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Set the package visibility to Public for anonymous pulls, or authenticate Docker for private pulls.' >> "$GITHUB_STEP_SUMMARY"
